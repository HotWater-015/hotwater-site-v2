{{- with .Description -}}
<meta name="description" content="{{ . }}" />
{{- else -}}
<meta name="description" content="{{ .Site.Params.description }}" />
{{- end }}

{{- with .Site.Params.author }}
<meta name="author" content="{{ . }}" />
{{- end }}

{{- $title := cond (ne .Title "") (printf "%s | %s" .Title .Site.Title) .Site.Title -}}
<link rel="canonical" href="{{ .Permalink }}" />
<meta property="og:site_name" content="{{ .Site.Title }}" />
<meta property="og:type" content="{{ cond .IsPage "article" "website" }}" />
<meta property="og:title" content="{{ $title }}" />
<meta property="og:description" content="{{ default .Site.Params.description .Description }}" />
<meta property="og:url" content="{{ .Permalink }}" />
{{- $img := default "/images/brand/hotwater-social.png" (.Params.ogImage | default "") }}
<meta property="og:image" content="{{ $img | absURL }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ $title }}" />
<meta name="twitter:description" content="{{ default .Site.Params.description .Description }}" />
<meta name="twitter:image" content="{{ $img | absURL }}" />
